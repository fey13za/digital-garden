# Inspiratie voor de digital garden van Feyza


---

# Agenda


1. Geboorte bloemen
2. 10 links
3. 50 afbeeldingen
4. introtekst van max. 180 tekens

---

# Geboorte bloemen

Vanaf jouw geboorte wordt er bepaald wat voor 'bloem' jij bent. 
Ik, persoonlijk, houd van bloemen en vind dit concept erg interessant. 
Hoe wordt dit bepaald en wie heeft hier bedacht? Je kan veel verschillende dingen hierover vinden 
en veel in de war raken als verschillende bronnen er verschillende dingen over zeggen. 
Ik ga op onderzoek uit!
---

# 10 links

De links zelf:
1.https://weeklyflower.nl/bloemenbibliotheek/geboortebloem-maand/ ->Dit geeft een handig overzicht over
bij welke maand welke bloem hoort.
2.https://www.fiestajewellery.nl/blogs/blog/waarom-heeft-elke-maand-een-eigen-geboortebloem -> Hier werd het victoriaanse
tijdperk benoemd, waardoor ik door ben gaan zoeken naar bronnen hierover.
3.https://vertaalbureau-scandic.nl/victoriaanse-taal-van-bloemen-wat-betekenen-ze/ Dit artikel gaat echt in op 
de taal van de bloemen (niet alleen die uit de maanden) inclusief wat verschillende kleuren betekenen, vanuit het vctoriaanse tijdperk.
4.https://floriografie.nl/category/geboortebloemen/ Dit artikel geeft echt een uitleg over waarom 
deze bloem word gekoppeld aan deze maand.
5.https://anilens.com/product/houten-schijf-met-geboortebloemen-26cm/ Visuele representatie van twee bloemen per maand 
6.https://nl.wiktionary.org/wiki/bloementaal dit is een leuk stukje over de betekenis van het woord
7.https://nl.jardineriaon.com/floriografie.html Dit gaat dieper in op de geschiedenis en andere aspecten
8.https://flowerslib.com/nl/bloementaal/ Een soort woordenboek voor bloemen
9.https://zodiacstock.com/zodiac/zodiac-flower-chart nog een mooi overzicht, twee per maand
10.https://www.homefortheharvest.com/lily-of-the-valley/ Tot slot - mijn geboorte bloem

# 50(ish) afbeeldingen

Waarom kies je specifiek voor deze verzameling? Zijn er patronen te ontdekken? Heeft
alles een specifieke kleurstelling? Herken je een actie, een gevoel, een materiaal of
een standpunt? Wat is kenmerkend voor deze verzameling? Welke dingen komen steeds terug?
